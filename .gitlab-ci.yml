pages:
  stage: deploy
  script:
    # Quarto rendert nach docs/ (output-dir in _quarto.yml).
    # GitLab Pages veroeffentlicht ausschliesslich den Ordner public/.
    - rm -rf public && cp -r docs public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
